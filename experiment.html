<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>IMU Experiments</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
            background: #08080f;
            color: #f0f0f5;
            min-height: 100vh;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 76px);
        }
        .header {
            background: rgba(16, 16, 28, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-back {
            padding: 5px 10px;
            background: rgba(255, 255, 255, 0.06);
            color: #ccc;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            font-size: 0.76rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .source-segmented {
            display: inline-flex;
            background: rgba(255, 255, 255, 0.06);
            padding: 2px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .seg-btn {
            background: transparent;
            border: none;
            color: #9a9ab0;
            padding: 5px 10px;
            font-size: 0.74rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .seg-btn.active {
            background: linear-gradient(135deg, #00d2ff, #0083b0);
            color: #fff;
        }

        .status-dot-wrap {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.72rem;
            color: #8e8ea0;
            background: rgba(255, 255, 255, 0.04);
            padding: 3px 8px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .dot { width: 7px; height: 7px; min-width: 7px; border-radius: 50%; background: #00d264; box-shadow: 0 0 8px rgba(0, 210, 100, 0.6); }
        .dot.recording { background: #ff4444; box-shadow: 0 0 8px rgba(255, 68, 68, 0.8); animation: blink 0.8s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* Mobile Horizontal Condition Carousel */
        .conditions-bar {
            padding: 10px 12px 0 12px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .conditions-bar::-webkit-scrollbar { display: none; }

        .cond-chip {
            flex: 0 0 auto;
            padding: 8px 12px;
            background: #111120;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            color: #ccc;
            min-width: 130px;
        }
        .cond-chip.active {
            background: rgba(0, 210, 255, 0.12);
            border-color: #00d2ff;
            color: #00d2ff;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.12);
        }
        .cond-chip .cond-name { font-weight: 700; font-size: 0.78rem; margin-bottom: 2px; }
        .cond-chip .cond-status { font-size: 0.65rem; color: #888; }
        .cond-chip.active .cond-status { color: #88ccdd; }

        .content {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .action-panel {
            background: #111120;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 12px 14px;
        }
        .action-info h3 { font-size: 0.92rem; color: #fff; margin-bottom: 2px; }
        .action-info p { font-size: 0.74rem; color: #888; }

        .charts-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        @media (min-width: 768px) {
            .charts-row { grid-template-columns: 1fr 1fr; }
        }

        .chart-box {
            background: #111120;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 12px 14px;
        }
        .chart-title { font-size: 0.8rem; font-weight: 600; color: #00d2ff; margin-bottom: 6px; }
        .chart-canvas-wrap { height: 135px; background: #090912; border-radius: 8px; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; }

        .recordings-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.76rem;
            margin-top: 6px;
        }
        .recordings-table th, .recordings-table td {
            padding: 7px 6px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .recordings-table th { color: #7a7a90; font-weight: 500; text-transform: uppercase; font-size: 0.64rem; }

        /* Floating Bottom Action Toolbar */
        .bottom-toolbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(14, 14, 24, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px 16px calc(env(safe-area-inset-bottom, 12px) + 8px) 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            z-index: 99;
        }

        .btn {
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.84rem;
            font-weight: 700;
            height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            outline: none;
        }
        .btn-record-main {
            flex: 1.5;
            background: linear-gradient(135deg, #00b4db, #0083b0);
            color: #fff;
            box-shadow: 0 4px 14px rgba(0, 180, 219, 0.3);
        }
        .btn-record-main.recording {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            box-shadow: 0 4px 14px rgba(255, 65, 108, 0.4);
        }
        .btn-action-sub {
            flex: 1;
            background: rgba(255, 255, 255, 0.08);
            color: #d0d0e0;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .btn:disabled { opacity: 0.35; }
    </style>
</head>
<body>
    <!-- Top Header -->
    <header class="header">
        <div class="header-left">
            <a href="index.html" class="btn-back">⬅ Back</a>
            <div class="source-segmented">
                <button id="srcEarphones" class="seg-btn active" onclick="setSource('earphones')">🎧 Earphones</button>
                <button id="srcPhone" class="seg-btn" onclick="setSource('phone')">📱 Phone</button>
            </div>
        </div>
        <div class="status-dot-wrap">
            <div id="statusDot" class="dot"></div>
            <span id="statusLabel">Active</span>
        </div>
    </header>

    <!-- Condition Horizontal Scroll Selector -->
    <div class="conditions-bar" id="conditionsBar">
        <div class="cond-chip active" onclick="selectCondition('EXP01', 'Static Baseline', 'Device resting flat on surface')">
            <div class="cond-name">EXP01: Static</div>
            <div class="cond-status" id="status-EXP01">⚪ Pending</div>
        </div>
        <div class="cond-chip" onclick="selectCondition('EXP02', 'Tap Vibration', 'Light finger tapping nearby surface')">
            <div class="cond-name">EXP02: Tap Vibe</div>
            <div class="cond-status" id="status-EXP02">⚪ Pending</div>
        </div>
        <div class="cond-chip" onclick="selectCondition('EXP03', 'Handheld Still', 'Holding device still in hand')">
            <div class="cond-name">EXP03: Handheld</div>
            <div class="cond-status" id="status-EXP03">⚪ Pending</div>
        </div>
        <div class="cond-chip" onclick="selectCondition('EXP04', '3D Motion', 'Periodic rotation and tilting')">
            <div class="cond-name">EXP04: 3D Motion</div>
            <div class="cond-status" id="status-EXP04">⚪ Pending</div>
        </div>
    </div>

    <!-- Main Content Area -->
    <main class="content">
        <div class="action-panel">
            <div class="action-info">
                <h3 id="curCondTitle">EXP01: Static Baseline</h3>
                <p id="curCondDesc">Device resting flat on surface</p>
            </div>
        </div>

        <!-- Waveforms -->
        <div class="charts-row">
            <div class="chart-box">
                <div class="chart-title">Acceleration Waveform (G)</div>
                <div class="chart-canvas-wrap"><canvas id="accChart"></canvas></div>
            </div>
            <div class="chart-box">
                <div class="chart-title">Gyroscope Waveform (rad/s)</div>
                <div class="chart-canvas-wrap"><canvas id="gyroChart"></canvas></div>
            </div>
        </div>

        <!-- History Table -->
        <div class="chart-box">
            <div class="chart-title">📋 Recorded Datasets</div>
            <table class="recordings-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Src</th>
                        <th>Samples</th>
                        <th>Dur</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="recordingsBody">
                    <tr><td colspan="5" style="color:#666; text-align:center; padding:12px 0;">No recordings yet</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Floating Bottom Action Toolbar -->
    <nav class="bottom-toolbar">
        <button id="btnRecord" class="btn btn-record-main" onclick="toggleRecording()">
            <span>⏺ Record</span>
        </button>
        <button id="btnExportAll" class="btn btn-action-sub" onclick="exportAllRecordings()" disabled>
            <span>📤 Share All</span>
        </button>
    </nav>

    <script>
    const expState = {
        currentSource: 'earphones',
        active: true,
        recording: false,
        curCondId: 'EXP01',
        curCondName: 'Static Baseline',
        curCondDesc: 'Device resting flat on surface',
        curSamples: [],
        recordStartTime: null,
        completedRecordings: {},
        chartData: { acc: { x:[], y:[], z:[] }, gyro: { x:[], y:[], z:[] } },
        currentAttitude: [0,0,0],
        currentMatrix: [1,0,0, 0,1,0, 0,0,1]
    };

    const G_CONST = 9.80665;
    const DEG_TO_RAD = Math.PI / 180;

    function formatTime(d) {
        return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}.${String(d.getMilliseconds()).padStart(3,'0')}`;
    }

    function sendNativeMessage(action, payload) {
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.nativeBridge) {
            window.webkit.messageHandlers.nativeBridge.postMessage({ action, payload });
        }
    }

    function setSource(source) {
        expState.currentSource = source;
        document.getElementById('srcEarphones').classList.toggle('active', source === 'earphones');
        document.getElementById('srcPhone').classList.toggle('active', source === 'phone');
        document.getElementById('statusLabel').textContent = `${source === 'earphones' ? 'Earphones' : 'Phone'} Active`;
        sendNativeMessage('setSource', { source });
    }

    function feedMotionData(ax, ay, az, gx, gy, gz, fromSource) {
        if (fromSource && fromSource !== expState.currentSource) return;

        push(expState.chartData.acc, [ax, ay, az]);
        push(expState.chartData.gyro, [gx, gy, gz]);

        if (expState.recording) {
            expState.curSamples.push({
                timestamp: formatTime(new Date()),
                source: expState.currentSource,
                userAcceleration: [ax, ay, az],
                rotationRate: [gx, gy, gz],
                rotationMatrix: [...expState.currentMatrix],
                attitude: [...expState.currentAttitude]
            });
        }
    }

    function feedOrientationData(roll, pitch, yaw, matrix, fromSource) {
        if (fromSource && fromSource !== expState.currentSource) return;
        expState.currentAttitude = [roll, pitch, yaw];
        if (matrix && matrix.length === 9) expState.currentMatrix = matrix;
    }

    function push(d, arr) {
        d.x.push(arr[0]); d.y.push(arr[1]); d.z.push(arr[2]);
        if (d.x.length > 200) { d.x.shift(); d.y.shift(); d.z.shift(); }
    }

    function selectCondition(id, name, desc) {
        if (expState.recording) {
            alert('Please stop recording first.');
            return;
        }
        expState.curCondId = id;
        expState.curCondName = name;
        expState.curCondDesc = desc;

        document.querySelectorAll('.cond-chip').forEach(b => b.classList.remove('active'));
        event.currentTarget.classList.add('active');

        document.getElementById('curCondTitle').textContent = `${id}: ${name}`;
        document.getElementById('curCondDesc').textContent = desc;
    }

    function toggleRecording() {
        expState.recording = !expState.recording;
        const btn = document.getElementById('btnRecord');

        if (expState.recording) {
            expState.curSamples = [];
            expState.recordStartTime = Date.now();
            btn.innerHTML = '<span>⏹ Stop</span>';
            btn.classList.add('recording');
            document.getElementById('statusDot').className = 'dot recording';
            document.getElementById('statusLabel').textContent = `Recording`;
            document.getElementById('statusLabel').style.color = '#ff4444';
            sendNativeMessage('startRecording', { source: expState.currentSource, condition: expState.curCondId });
        } else {
            const duration = ((Date.now() - expState.recordStartTime) / 1000).toFixed(2);
            btn.innerHTML = '<span>⏺ Record</span>';
            btn.classList.remove('recording');
            document.getElementById('statusDot').className = 'dot';
            document.getElementById('statusLabel').textContent = `Active`;
            document.getElementById('statusLabel').style.color = '#00d264';

            const record = {
                id: expState.curCondId,
                source: expState.currentSource,
                name: expState.curCondName,
                count: expState.curSamples.length,
                duration: duration + 's',
                samples: [...expState.curSamples]
            };

            const key = `${expState.currentSource}_${expState.curCondId}`;
            expState.completedRecordings[key] = record;
            const badge = document.getElementById(`status-${expState.curCondId}`);
            if (badge) badge.innerHTML = `<span style="color:#00d264">✅ (${record.count})</span>`;

            renderTable();
            document.getElementById('btnExportAll').disabled = false;
            sendNativeMessage('stopRecording', { source: expState.currentSource, condition: expState.curCondId, sampleCount: record.count });
        }
    }

    function renderTable() {
        const body = document.getElementById('recordingsBody');
        const keys = Object.keys(expState.completedRecordings);
        if (keys.length === 0) {
            body.innerHTML = '<tr><td colspan="5" style="color:#666; text-align:center; padding:12px 0;">No recordings yet</td></tr>';
            return;
        }

        body.innerHTML = keys.map(k => {
            const r = expState.completedRecordings[k];
            return `<tr>
                <td><strong>${r.id}</strong></td>
                <td><span style="color:#00d2ff; font-weight:600;">${r.source.slice(0,3)}</span></td>
                <td>${r.count}</td>
                <td>${r.duration}</td>
                <td><button class="btn btn-action-sub" style="height:26px; padding:0 8px; font-size:0.68rem;" onclick="exportSingle('${k}')">📤</button></td>
            </tr>`;
        }).join('');
    }

    function exportSingle(key) {
        const r = expState.completedRecordings[key];
        if (!r) return;
        const csv = toCSV(r.samples);
        const filename = `${r.source}_${r.id}_${r.name.replace(/\s+/g, '_')}.csv`;

        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.nativeBridge) {
            const files = {};
            files[filename] = csv;
            sendNativeMessage('shareFiles', { files });
        } else {
            downloadFile(csv, filename);
        }
    }

    function exportAllRecordings() {
        const files = {};
        Object.keys(expState.completedRecordings).forEach(k => {
            const r = expState.completedRecordings[k];
            files[`${r.source}_${r.id}_${r.name.replace(/\s+/g, '_')}.csv`] = toCSV(r.samples);
        });

        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.nativeBridge) {
            sendNativeMessage('shareFiles', { files });
        } else {
            Object.keys(files).forEach(name => downloadFile(files[name], name));
        }
    }

    function toCSV(samples) {
        const header = 'timestamp,source,acc_x,acc_y,acc_z,gyro_x,gyro_y,gyro_z,m11,m12,m13,m21,m22,m23,m31,m32,m33,roll,pitch,yaw\n';
        const rows = samples.map(s => [
            s.timestamp,
            s.source || expState.currentSource,
            ...s.userAcceleration.map(v => v.toFixed(6)),
            ...s.rotationRate.map(v => v.toFixed(6)),
            ...s.rotationMatrix.map(v => v.toFixed(6)),
            ...(s.attitude || [0,0,0]).map(v => v.toFixed(6))
        ].join(',')).join('\n');
        return header + rows;
    }

    function downloadFile(content, filename) {
        const blob = new Blob([content], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename; a.click();
        URL.revokeObjectURL(url);
    }

    function drawChart(canvasId, data, colors) {
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);

        const w = rect.width, h = rect.height;
        ctx.clearRect(0, 0, w, h);

        if (data.x.length < 2) return;
        const all = [...data.x, ...data.y, ...data.z];
        let min = Math.min(...all), max = Math.max(...all);
        const range = max - min || 1;
        min -= range * 0.15; max += range * 0.15;

        const channels = [
            { v: data.x, c: colors[0] },
            { v: data.y, c: colors[1] },
            { v: data.z, c: colors[2] }
        ];

        channels.forEach(ch => {
            ctx.strokeStyle = ch.c;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            for (let i = 0; i < ch.v.length; i++) {
                const x = (i / 199) * w;
                const y = h - ((ch.v[i] - min) / (max - min)) * h;
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();
        });
    }

    function loop() {
        drawChart('accChart', expState.chartData.acc, ['#ff6b6b', '#51cf66', '#339af0']);
        drawChart('gyroChart', expState.chartData.gyro, ['#ff6b6b', '#51cf66', '#339af0']);
        requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
    </script>
</body>
</html>
