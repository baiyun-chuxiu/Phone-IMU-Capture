<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>IMU Experiments Suite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
            background: #f5f6f8;
            color: #1d1d1f;
            min-height: 100vh;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 76px);
        }
        .header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-back {
            padding: 5px 10px;
            background: #eef0f3;
            color: #333;
            border: 1px solid #dcdfe6;
            border-radius: 8px;
            font-size: 0.76rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .source-segmented {
            display: inline-flex;
            background: #e5e6eb;
            padding: 2px;
            border-radius: 8px;
            border: 1px solid #dcdfe6;
        }
        .seg-btn {
            background: transparent;
            border: none;
            color: #666;
            padding: 5px 10px;
            font-size: 0.74rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .seg-btn.active {
            background: #0071e3;
            color: #fff;
        }

        .status-dot-wrap {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.72rem;
            color: #555;
            background: #eef0f3;
            padding: 3px 8px;
            border-radius: 16px;
            border: 1px solid #dcdfe6;
        }
        .dot { width: 7px; height: 7px; min-width: 7px; border-radius: 50%; background: #aaa; transition: all 0.3s; }
        .dot.connected { background: #2b8a3e; box-shadow: 0 0 8px rgba(43, 138, 62, 0.6); }
        .dot.recording { background: #e03131; box-shadow: 0 0 8px rgba(224, 49, 49, 0.8); animation: blink 0.8s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* Condition Horizontal Scroll Selector */
        .conditions-bar {
            padding: 10px 12px 0 12px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .conditions-bar::-webkit-scrollbar { display: none; }

        .cond-chip {
            flex: 0 0 auto;
            padding: 8px 12px;
            background: #ffffff;
            border: 1px solid #e2e4e8;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            color: #444;
            min-width: 130px;
        }
        .cond-chip.active {
            background: #f0f7ff;
            border-color: #0071e3;
            color: #0071e3;
            box-shadow: 0 0 10px rgba(0, 113, 227, 0.15);
        }
        .cond-chip .cond-name { font-weight: 700; font-size: 0.78rem; margin-bottom: 2px; }
        .cond-chip .cond-status { font-size: 0.65rem; color: #888; }
        .cond-chip.active .cond-status { color: #0056b3; }

        .content {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .action-panel {
            background: #ffffff;
            border: 1px solid #e2e4e8;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            border-radius: 12px;
            padding: 12px 14px;
        }
        .action-info h3 { font-size: 0.92rem; color: #1d1d1f; margin-bottom: 2px; }
        .action-info p { font-size: 0.74rem; color: #666; }

        .charts-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        @media (min-width: 768px) {
            .charts-row { grid-template-columns: 1fr 1fr; }
        }

        .chart-box {
            background: #ffffff;
            border: 1px solid #e2e4e8;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            border-radius: 12px;
            padding: 12px 14px;
        }
        .chart-title { font-size: 0.8rem; font-weight: 600; color: #0071e3; margin-bottom: 6px; }
        .chart-canvas-wrap { height: 135px; background: #ffffff; border: 1px solid #e2e4e8; border-radius: 8px; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; }

        .recordings-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.76rem;
            margin-top: 6px;
        }
        .recordings-table th, .recordings-table td {
            padding: 7px 6px;
            text-align: left;
            border-bottom: 1px solid #eef0f3;
        }
        .recordings-table th { color: #86868b; font-weight: 500; text-transform: uppercase; font-size: 0.64rem; }

        /* Floating Bottom Action Toolbar */
        .bottom-toolbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            padding: 10px 16px calc(env(safe-area-inset-bottom, 12px) + 8px) 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            z-index: 99;
        }

        .btn {
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.84rem;
            font-weight: 700;
            height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            outline: none;
        }
        .btn-record-main {
            flex: 1.5;
            background: linear-gradient(135deg, #0071e3, #0056b3);
            color: #fff;
            box-shadow: 0 4px 14px rgba(0, 113, 227, 0.25);
        }
        .btn-record-main.recording {
            background: linear-gradient(135deg, #e03131, #c92a2a);
            box-shadow: 0 4px 14px rgba(224, 49, 49, 0.35);
        }
        .btn-action-sub {
            flex: 1;
            background: #eef0f3;
            color: #1d1d1f;
            border: 1px solid #dcdfe6;
        }
        .btn:disabled { opacity: 0.35; }
    </style>
</head>
<body>
    <!-- Top Header -->
    <header class="header">
        <div class="header-left">
            <a href="index.html" class="btn-back">⬅ Back</a>
            <div class="source-segmented">
                <button id="srcEarphones" class="seg-btn active" onclick="setSource('earphones')">🎧 Earphones</button>
                <button id="srcPhone" class="seg-btn" onclick="setSource('phone')">📱 Phone</button>
            </div>
        </div>
        <div class="status-dot-wrap">
            <div id="statusDot" class="dot"></div>
            <span id="statusLabel">Active</span>
        </div>
    </header>

    <!-- Condition Carousel -->
    <div class="conditions-bar" id="conditionsBar">
        <div class="cond-chip active" onclick="selectCondition('EXP01', 'Static Baseline', 'Device resting flat on surface')">
            <div class="cond-name">EXP01: Static</div>
            <div class="cond-status" id="status-EXP01">⚪ Pending</div>
        </div>
        <div class="cond-chip" onclick="selectCondition('EXP02', 'Tap Vibration', 'Light finger tapping nearby surface')">
            <div class="cond-name">EXP02: Tap Vibe</div>
            <div class="cond-status" id="status-EXP02">⚪ Pending</div>
        </div>
        <div class="cond-chip" onclick="selectCondition('EXP03', 'Handheld Still', 'Holding device still in hand')">
            <div class="cond-name">EXP03: Handheld</div>
            <div class="cond-status" id="status-EXP03">⚪ Pending</div>
        </div>
        <div class="cond-chip" onclick="selectCondition('EXP04', '3D Motion', 'Periodic rotation and tilting')">
            <div class="cond-name">EXP04: 3D Motion</div>
            <div class="cond-status" id="status-EXP04">⚪ Pending</div>
        </div>
    </div>

    <!-- Main Content Area -->
    <main class="content">
        <div class="action-panel">
            <div class="action-info">
                <h3 id="curCondTitle">EXP01: Static Baseline</h3>
                <p id="curCondDesc">Device resting flat on surface</p>
            </div>
        </div>

        <!-- Waveforms -->
        <div class="charts-row">
            <div class="chart-box">
                <div class="chart-title">Acceleration Waveform (G)</div>
                <div class="chart-canvas-wrap"><canvas id="accChart"></canvas></div>
            </div>
            <div class="chart-box">
                <div class="chart-title">Gyroscope Waveform (rad/s)</div>
                <div class="chart-canvas-wrap"><canvas id="gyroChart"></canvas></div>
            </div>
        </div>

        <!-- History Table -->
        <div class="chart-box">
            <div class="chart-title">📋 Recorded Datasets</div>
            <table class="recordings-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Src</th>
                        <th>Samples</th>
                        <th>Dur</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="recordingsBody">
                    <tr><td colspan="5" style="color:#888; text-align:center; padding:12px 0;">No recordings yet</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Floating Bottom Action Toolbar -->
    <nav class="bottom-toolbar">
        <button id="btnRecord" class="btn btn-record-main" onclick="toggleRecording()">
            <span>⏺ Record</span>
        </button>
        <button id="btnExportAll" class="btn btn-action-sub" onclick="exportAllRecordings()" disabled>
            <span>📥 Download All</span>
        </button>
    </nav>

    <script>
    const expState = {
        currentSource: 'earphones',
        ws: null,
        wsConnected: false,
        phoneActive: false,
        recording: false,
        curCondId: 'EXP01',
        curCondName: 'Static Baseline',
        curCondDesc: 'Device resting flat on surface',
        curSamples: [],
        recordStartTime: null,
        completedRecordings: {},
        chartData: { acc: { x:[], y:[], z:[] }, gyro: { x:[], y:[], z:[] } },
        currentAttitude: [0,0,0],
        currentMatrix: [1,0,0, 0,1,0, 0,0,1]
    };

    const G_CONST = 9.80665;
    const DEG_TO_RAD = Math.PI / 180;

    function formatTime(d) {
        return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}.${String(d.getMilliseconds()).padStart(3,'0')}`;
    }

    function setSource(source) {
        expState.currentSource = source;
        document.getElementById('srcEarphones').classList.toggle('active', source === 'earphones');
        document.getElementById('srcPhone').classList.toggle('active', source === 'phone');

        if (source === 'earphones') {
            stopPhone();
            connectWS();
        } else {
            closeWS();
            startPhone();
        }
        updateStatus();
    }

    function updateStatus() {
        const dot = document.getElementById('statusDot');
        const label = document.getElementById('statusLabel');

        dot.className = 'dot';
        if (expState.recording) {
            dot.classList.add('recording');
            label.textContent = 'Recording';
        } else if (expState.currentSource === 'earphones') {
            if (expState.wsConnected) { dot.classList.add('connected'); label.textContent = 'Earphones Live'; }
            else { label.textContent = 'Earphones Offline'; }
        } else {
            if (expState.phoneActive) { dot.classList.add('connected'); label.textContent = 'Phone Live'; }
            else { label.textContent = 'Phone Standby'; }
        }
    }

    // Earphones WS
    function connectWS() {
        if (expState.ws) return;
        const wsUrl = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
            ? `ws://${location.host}/ws`
            : 'ws://localhost:8765/ws';

        try {
            expState.ws = new WebSocket(wsUrl);
            expState.ws.onopen = () => { expState.wsConnected = true; updateStatus(); };
            expState.ws.onmessage = (e) => {
                if (expState.currentSource !== 'earphones') return;
                try {
                    const s = JSON.parse(e.data);
                    if (s.type === 'status') return;
                    handleSample(s.userAcceleration[0], s.userAcceleration[1], s.userAcceleration[2],
                                 s.rotationRate[0], s.rotationRate[1], s.rotationRate[2],
                                 s.attitude, s.rotationMatrix, 'earphones');
                } catch(err){}
            };
            expState.ws.onclose = () => { expState.wsConnected = false; expState.ws = null; updateStatus(); };
            expState.ws.onerror = () => { expState.wsConnected = false; updateStatus(); };
        } catch(e){}
    }

    function closeWS() {
        if (expState.ws) { expState.ws.close(); expState.ws = null; }
        expState.wsConnected = false;
    }

    // Phone Sensors
    async function startPhone() {
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
            try { await DeviceMotionEvent.requestPermission(); } catch(e){}
        }
        expState.phoneActive = true;
        window.addEventListener('devicemotion', onMotion, true);
        window.addEventListener('deviceorientation', onOrient, true);
        updateStatus();
    }

    function stopPhone() {
        expState.phoneActive = false;
        window.removeEventListener('devicemotion', onMotion, true);
        window.removeEventListener('deviceorientation', onOrient, true);
    }

    function onOrient(e) {
        if (expState.currentSource !== 'phone') return;
        const a = (e.alpha||0)*DEG_TO_RAD, b = (e.beta||0)*DEG_TO_RAD, g = (e.gamma||0)*DEG_TO_RAD;
        expState.currentAttitude = [g, b, a];
    }

    function onMotion(e) {
        if (expState.currentSource !== 'phone') return;
        const acc = e.acceleration || {}, rot = e.rotationRate || {};
        handleSample((acc.x||0)/G_CONST, (acc.y||0)/G_CONST, (acc.z||0)/G_CONST,
                     (rot.beta||0)*DEG_TO_RAD, (rot.gamma||0)*DEG_TO_RAD, (rot.alpha||0)*DEG_TO_RAD,
                     expState.currentAttitude, expState.currentMatrix, 'phone');
    }

    function handleSample(ax, ay, az, gx, gy, gz, att, mat, src) {
        push(expState.chartData.acc, [ax, ay, az]);
        push(expState.chartData.gyro, [gx, gy, gz]);

        if (att) expState.currentAttitude = att;
        if (mat) expState.currentMatrix = mat;

        if (expState.recording) {
            expState.curSamples.push({
                timestamp: formatTime(new Date()),
                source: src,
                userAcceleration: [ax, ay, az],
                rotationRate: [gx, gy, gz],
                rotationMatrix: [...expState.currentMatrix],
                attitude: [...expState.currentAttitude]
            });
        }
    }

    function push(d, arr) {
        d.x.push(arr[0]); d.y.push(arr[1]); d.z.push(arr[2]);
        if (d.x.length > 200) { d.x.shift(); d.y.shift(); d.z.shift(); }
    }

    function selectCondition(id, name, desc) {
        if (expState.recording) { alert('Please stop recording first.'); return; }
        expState.curCondId = id; expState.curCondName = name; expState.curCondDesc = desc;

        document.querySelectorAll('.cond-chip').forEach(b => b.classList.remove('active'));
        event.currentTarget.classList.add('active');

        document.getElementById('curCondTitle').textContent = `${id}: ${name}`;
        document.getElementById('curCondDesc').textContent = desc;
    }

    function toggleRecording() {
        expState.recording = !expState.recording;
        const btn = document.getElementById('btnRecord');

        if (expState.recording) {
            expState.curSamples = [];
            expState.recordStartTime = Date.now();
            btn.innerHTML = '<span>⏹ Stop</span>';
            btn.classList.add('recording');
            updateStatus();
        } else {
            const duration = ((Date.now() - expState.recordStartTime) / 1000).toFixed(2);
            btn.innerHTML = '<span>⏺ Record</span>';
            btn.classList.remove('recording');
            updateStatus();

            const record = {
                id: expState.curCondId,
                source: expState.currentSource,
                name: expState.curCondName,
                count: expState.curSamples.length,
                duration: duration + 's',
                samples: [...expState.curSamples]
            };

            const key = `${expState.currentSource}_${expState.curCondId}`;
            expState.completedRecordings[key] = record;
            const badge = document.getElementById(`status-${expState.curCondId}`);
            if (badge) badge.innerHTML = `<span style="color:#2b8a3e">✅ (${record.count})</span>`;

            renderTable();
            document.getElementById('btnExportAll').disabled = false;
        }
    }

    function renderTable() {
        const body = document.getElementById('recordingsBody');
        const keys = Object.keys(expState.completedRecordings);
        if (keys.length === 0) {
            body.innerHTML = '<tr><td colspan="5" style="color:#888; text-align:center; padding:12px 0;">No recordings yet</td></tr>';
            return;
        }

        body.innerHTML = keys.map(k => {
            const r = expState.completedRecordings[k];
            return `<tr>
                <td><strong>${r.id}</strong></td>
                <td><span style="color:#0071e3; font-weight:600;">${r.source.slice(0,3)}</span></td>
                <td>${r.count}</td>
                <td>${r.duration}</td>
                <td><button class="btn btn-action-sub" style="height:26px; padding:0 8px; font-size:0.68rem;" onclick="exportSingle('${k}')">📥</button></td>
            </tr>`;
        }).join('');
    }

    function exportSingle(key) {
        const r = expState.completedRecordings[key];
        if (!r) return;
        downloadFile(toCSV(r.samples), `${r.source}_${r.id}_${r.name.replace(/\s+/g, '_')}.csv`);
    }

    function exportAllRecordings() {
        Object.keys(expState.completedRecordings).forEach(k => {
            const r = expState.completedRecordings[k];
            downloadFile(toCSV(r.samples), `${r.source}_${r.id}_${r.name.replace(/\s+/g, '_')}.csv`);
        });
    }

    function toCSV(samples) {
        const header = 'timestamp,source,acc_x,acc_y,acc_z,gyro_x,gyro_y,gyro_z,m11,m12,m13,m21,m22,m23,m31,m32,m33,roll,pitch,yaw\n';
        const rows = samples.map(s => [
            s.timestamp,
            s.source || expState.currentSource,
            ...s.userAcceleration.map(v => v.toFixed(6)),
            ...s.rotationRate.map(v => v.toFixed(6)),
            ...s.rotationMatrix.map(v => v.toFixed(6)),
            ...(s.attitude || [0,0,0]).map(v => v.toFixed(6))
        ].join(',')).join('\n');
        return header + rows;
    }

    function downloadFile(content, filename) {
        const blob = new Blob([content], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename; a.click();
        URL.revokeObjectURL(url);
    }

    function drawChart(canvasId, data, colors) {
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);

        const w = rect.width, h = rect.height;
        ctx.clearRect(0, 0, w, h);

        ctx.strokeStyle = 'rgba(0, 0, 0, 0.05)';
        ctx.lineWidth = 1;
        for (let i = 0; i <= 4; i++) {
            const y = (h / 4) * i;
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
        }

        if (data.x.length < 2) return;
        const all = [...data.x, ...data.y, ...data.z];
        let min = Math.min(...all), max = Math.max(...all);
        const range = max - min || 1;
        min -= range * 0.15; max += range * 0.15;

        const channels = [
            { v: data.x, c: colors[0] },
            { v: data.y, c: colors[1] },
            { v: data.z, c: colors[2] }
        ];

        channels.forEach(ch => {
            ctx.strokeStyle = ch.c;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            for (let i = 0; i < ch.v.length; i++) {
                const x = (i / 199) * w;
                const y = h - ((ch.v[i] - min) / (max - min)) * h;
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();
        });
    }

    function loop() {
        drawChart('accChart', expState.chartData.acc, ['#e03131', '#2b8a3e', '#1971c2']);
        drawChart('gyroChart', expState.chartData.gyro, ['#e03131', '#2b8a3e', '#1971c2']);
        requestAnimationFrame(loop);
    }

    connectWS();
    requestAnimationFrame(loop);
    </script>
</body>
</html>
