<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phone IMU Experiments</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
            background: #08080f;
            color: #f0f0f5;
            min-height: 100vh;
        }
        .header {
            background: rgba(18, 18, 32, 0.85);
            backdrop-filter: blur(16px);
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 { font-size: 1.05rem; font-weight: 700; color: #00d2ff; }
        .header h1::before { content: '🧪 '; }
        .status-bar { display: flex; align-items: center; gap: 10px; }
        .status-dot-wrap {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: #8e8ea0;
            background: rgba(255, 255, 255, 0.04);
            padding: 3px 8px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .dot { width: 7px; height: 7px; border-radius: 50%; background: #666; transition: all 0.3s; }
        .dot.connected { background: #00d264; box-shadow: 0 0 10px rgba(0, 210, 100, 0.6); }
        .dot.recording { background: #ff4444; box-shadow: 0 0 10px rgba(255, 68, 68, 0.8); animation: blink 0.8s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .main { display: grid; grid-template-columns: minmax(240px, 300px) 1fr; gap: 0; min-height: calc(100vh - 54px); }
        @media (max-width: 768px) {
            .main { grid-template-columns: 1fr; }
        }

        /* Sidebar */
        .sidebar {
            background: #10101e;
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            overflow-y: auto;
            padding: 16px;
        }
        .sidebar h2 { font-size: 0.78rem; color: #7a7a90; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }

        .condition-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
        .condition-btn {
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            color: #ccc;
        }
        .condition-btn:hover { background: rgba(0, 210, 255, 0.08); border-color: rgba(0, 210, 255, 0.3); color: #fff; }
        .condition-btn.active {
            background: rgba(0, 210, 255, 0.12);
            border-color: #00d2ff;
            color: #00d2ff;
            box-shadow: 0 0 16px rgba(0, 210, 255, 0.1);
        }
        .condition-btn .cond-name { font-weight: 600; font-size: 0.88rem; margin-bottom: 2px; }
        .condition-btn .cond-desc { font-size: 0.72rem; color: #777; }
        .condition-btn.active .cond-desc { color: #88ccdd; }
        .condition-btn .cond-status { font-size: 0.68rem; margin-top: 4px; }

        /* Content Area */
        .content {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 16px;
            gap: 14px;
        }

        .action-panel {
            background: #111120;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .action-info h3 { font-size: 1rem; color: #fff; margin-bottom: 3px; }
        .action-info p { font-size: 0.78rem; color: #888; }
        .action-btns { display: flex; gap: 8px; }

        .btn {
            padding: 7px 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .btn-primary { background: linear-gradient(135deg, #00b4db, #0083b0); color: white; }
        .btn-danger { background: linear-gradient(135deg, #ff416c, #ff4b2b); color: white; }
        .btn-success { background: linear-gradient(135deg, #11998e, #38ef7d); color: white; }
        .btn-secondary { background: rgba(255, 255, 255, 0.06); color: #ccc; border: 1px solid rgba(255, 255, 255, 0.08); }

        .charts-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 14px;
        }
        .chart-box {
            background: #111120;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 14px;
        }
        .chart-title { font-size: 0.84rem; font-weight: 600; color: #00d2ff; margin-bottom: 8px; }
        .chart-canvas-wrap { height: 160px; background: #090912; border-radius: 8px; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; }

        .recordings-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            margin-top: 8px;
        }
        .recordings-table th, .recordings-table td {
            padding: 8px 10px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .recordings-table th { color: #7a7a90; font-weight: 500; text-transform: uppercase; font-size: 0.68rem; }
        .recordings-table tr:hover { background: rgba(255, 255, 255, 0.02); }
    </style>
</head>
<body>
    <header class="header">
        <div style="display:flex; align-items:center; gap: 10px;">
            <h1>Phone IMU Experiments</h1>
            <a href="index.html" class="btn btn-secondary" style="padding:4px 10px; font-size:0.75rem;">⬅ Back</a>
        </div>
        <div class="status-bar">
            <div class="status-dot-wrap">
                <div id="statusDot" class="dot"></div>
                <span id="statusLabel">Standby</span>
            </div>
            <button id="btnExportAll" class="btn btn-success" onclick="exportAllRecordings()" style="padding:5px 12px; font-size:0.78rem;" disabled>📦 Export CSV</button>
        </div>
    </header>

    <div class="main">
        <!-- Sidebar: Conditions -->
        <aside class="sidebar">
            <h2>🧪 Phone Test Conditions</h2>
            <div class="condition-list" id="conditionList">
                <button class="condition-btn active" onclick="selectCondition('P01', 'Phone Flat Static', 'Phone resting flat on table')">
                    <div class="cond-name">P01: Flat Static</div>
                    <div class="cond-desc">Table resting baseline noise</div>
                    <div class="cond-status" id="status-P01">⚪ Pending</div>
                </button>
                <button class="condition-btn" onclick="selectCondition('P02', 'Desk Tap Vibration', 'Light finger tapping near the phone')">
                    <div class="cond-name">P02: Tap Vibration</div>
                    <div class="cond-desc">Conducted surface vibration</div>
                    <div class="cond-status" id="status-P02">⚪ Pending</div>
                </button>
                <button class="condition-btn" onclick="selectCondition('P03', 'Handheld Stationary', 'Holding phone still in hand')">
                    <div class="cond-name">P03: Handheld Still</div>
                    <div class="cond-desc">Human tremor & hand stability</div>
                    <div class="cond-status" id="status-P03">⚪ Pending</div>
                </button>
                <button class="condition-btn" onclick="selectCondition('P04', 'Phone Tilt & Rotate', 'Tilting phone in X/Y/Z axes')">
                    <div class="cond-name">P04: Tilt & Rotate</div>
                    <div class="cond-desc">Dynamic 3D rotational test</div>
                    <div class="cond-status" id="status-P04">⚪ Pending</div>
                </button>
            </div>
        </aside>

        <!-- Content Area -->
        <main class="content">
            <div class="action-panel">
                <div class="action-info">
                    <h3 id="curCondTitle">P01: Phone Flat Static</h3>
                    <p id="curCondDesc">Phone resting flat on table</p>
                </div>
                <div class="action-btns">
                    <button id="btnRecord" class="btn btn-primary" onclick="toggleRecording()">⏺ Record</button>
                </div>
            </div>

            <!-- Waveforms -->
            <div class="charts-row">
                <div class="chart-box">
                    <div class="chart-title">Phone Acceleration (G)</div>
                    <div class="chart-canvas-wrap"><canvas id="accChart"></canvas></div>
                </div>
                <div class="chart-box">
                    <div class="chart-title">Phone Gyroscope (rad/s)</div>
                    <div class="chart-canvas-wrap"><canvas id="gyroChart"></canvas></div>
                </div>
            </div>

            <!-- History Table -->
            <div class="chart-box">
                <div class="chart-title">📋 Recorded Datasets</div>
                <table class="recordings-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Condition</th>
                            <th>Samples</th>
                            <th>Duration</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="recordingsBody">
                        <tr><td colspan="5" style="color:#666; text-align:center;">No recordings yet</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
    const expState = {
        active: false,
        recording: false,
        curCondId: 'P01',
        curCondName: 'Phone Flat Static',
        curCondDesc: 'Phone resting flat on table',
        curSamples: [],
        recordStartTime: null,
        completedRecordings: {},
        chartData: { acc: { x:[], y:[], z:[] }, gyro: { x:[], y:[], z:[] } },
        currentAttitude: [0,0,0],
        currentMatrix: [1,0,0, 0,1,0, 0,0,1]
    };

    const G_CONST = 9.80665;
    const DEG_TO_RAD = Math.PI / 180;

    function formatTime(d) {
        return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}.${String(d.getMilliseconds()).padStart(3,'0')}`;
    }

    async function initSensors() {
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
            try {
                const res = await DeviceMotionEvent.requestPermission();
                if (res === 'granted') {
                    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                        await DeviceOrientationEvent.requestPermission().catch(()=>{});
                    }
                    startListeners();
                }
            } catch(e) { startListeners(); }
        } else {
            startListeners();
        }
    }

    function startListeners() {
        if (expState.active) return;
        expState.active = true;
        window.addEventListener('devicemotion', onMotion, true);
        window.addEventListener('deviceorientation', onOrientation, true);
        document.getElementById('statusDot').className = 'dot connected';
        document.getElementById('statusLabel').textContent = 'Streaming';
        document.getElementById('statusLabel').style.color = '#00d264';
    }

    function onOrientation(e) {
        const a = (e.alpha||0)*DEG_TO_RAD, b = (e.beta||0)*DEG_TO_RAD, g = (e.gamma||0)*DEG_TO_RAD;
        expState.currentAttitude = [g, b, a];
        const cA = Math.cos(a), sA = Math.sin(a), cB = Math.cos(b), sB = Math.sin(b), cG = Math.cos(g), sG = Math.sin(g);
        expState.currentMatrix = [
            cA*cG - sA*sB*sG, -cB*sA, cA*sG + cG*sA*sB,
            cG*sA + cA*sB*sG,  cA*cB, sA*sG - cA*cG*sB,
            -cB*sG,           sB,     cB*cG
        ];
    }

    function onMotion(e) {
        const acc = e.acceleration || {};
        const rot = e.rotationRate || {};
        const ax = (acc.x||0)/G_CONST, ay = (acc.y||0)/G_CONST, az = (acc.z||0)/G_CONST;
        const gx = (rot.beta||0)*DEG_TO_RAD, gy = (rot.gamma||0)*DEG_TO_RAD, gz = (rot.alpha||0)*DEG_TO_RAD;

        push(expState.chartData.acc, [ax, ay, az]);
        push(expState.chartData.gyro, [gx, gy, gz]);

        if (expState.recording) {
            expState.curSamples.push({
                timestamp: formatTime(new Date()),
                userAcceleration: [ax, ay, az],
                rotationRate: [gx, gy, gz],
                rotationMatrix: [...expState.currentMatrix],
                gravity: [
                    ((e.accelerationIncludingGravity?.x||0) - (acc.x||0))/G_CONST,
                    ((e.accelerationIncludingGravity?.y||0) - (acc.y||0))/G_CONST,
                    ((e.accelerationIncludingGravity?.z||0) - (acc.z||0))/G_CONST
                ],
                attitude: [...expState.currentAttitude]
            });
        }
    }

    function push(d, arr) {
        d.x.push(arr[0]); d.y.push(arr[1]); d.z.push(arr[2]);
        if (d.x.length > 200) { d.x.shift(); d.y.shift(); d.z.shift(); }
    }

    function selectCondition(id, name, desc) {
        if (expState.recording) {
            alert('Please stop recording first.');
            return;
        }
        expState.curCondId = id;
        expState.curCondName = name;
        expState.curCondDesc = desc;

        document.querySelectorAll('.condition-btn').forEach(b => b.classList.remove('active'));
        event.currentTarget.classList.add('active');

        document.getElementById('curCondTitle').textContent = `${id}: ${name}`;
        document.getElementById('curCondDesc').textContent = desc;
    }

    function toggleRecording() {
        if (!expState.active) {
            initSensors();
            return;
        }

        expState.recording = !expState.recording;
        const btn = document.getElementById('btnRecord');

        if (expState.recording) {
            expState.curSamples = [];
            expState.recordStartTime = Date.now();
            btn.textContent = '⏹ Stop';
            btn.className = 'btn btn-danger';
            document.getElementById('statusDot').className = 'dot recording';
            document.getElementById('statusLabel').textContent = 'Recording';
            document.getElementById('statusLabel').style.color = '#ff4444';
        } else {
            const duration = ((Date.now() - expState.recordStartTime) / 1000).toFixed(2);
            btn.textContent = '⏺ Record';
            btn.className = 'btn btn-primary';
            document.getElementById('statusDot').className = 'dot connected';
            document.getElementById('statusLabel').textContent = 'Streaming';
            document.getElementById('statusLabel').style.color = '#00d264';

            const record = {
                id: expState.curCondId,
                name: expState.curCondName,
                count: expState.curSamples.length,
                duration: duration + 's',
                samples: [...expState.curSamples]
            };

            expState.completedRecordings[expState.curCondId] = record;
            const badge = document.getElementById(`status-${expState.curCondId}`);
            if (badge) badge.innerHTML = `<span style="color:#00d264">✅ (${record.count})</span>`;

            renderTable();
            document.getElementById('btnExportAll').disabled = false;
        }
    }

    function renderTable() {
        const body = document.getElementById('recordingsBody');
        const keys = Object.keys(expState.completedRecordings);
        if (keys.length === 0) {
            body.innerHTML = '<tr><td colspan="5" style="color:#666; text-align:center;">No recordings yet</td></tr>';
            return;
        }

        body.innerHTML = keys.map(k => {
            const r = expState.completedRecordings[k];
            return `<tr>
                <td><strong>${r.id}</strong></td>
                <td>${r.name}</td>
                <td>${r.count}</td>
                <td>${r.duration}</td>
                <td><button class="btn btn-secondary" style="padding:3px 8px; font-size:0.72rem;" onclick="exportSingle('${r.id}')">📥 CSV</button></td>
            </tr>`;
        }).join('');
    }

    function exportSingle(id) {
        const r = expState.completedRecordings[id];
        if (!r) return;
        const csv = toCSV(r.samples);
        downloadFile(csv, `phone_${r.id}_${r.name.replace(/\s+/g, '_')}.csv`);
    }

    function exportAllRecordings() {
        Object.keys(expState.completedRecordings).forEach(id => exportSingle(id));
    }

    function toCSV(samples) {
        const header = 'timestamp,acc_x,acc_y,acc_z,gyro_x,gyro_y,gyro_z,m11,m12,m13,m21,m22,m23,m31,m32,m33,grav_x,grav_y,grav_z,roll,pitch,yaw\n';
        const rows = samples.map(s => [
            s.timestamp,
            ...s.userAcceleration.map(v => v.toFixed(6)),
            ...s.rotationRate.map(v => v.toFixed(6)),
            ...s.rotationMatrix.map(v => v.toFixed(6)),
            ...(s.gravity || [0,0,0]).map(v => v.toFixed(6)),
            ...(s.attitude || [0,0,0]).map(v => v.toFixed(6))
        ].join(',')).join('\n');
        return header + rows;
    }

    function downloadFile(content, filename) {
        const blob = new Blob([content], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename; a.click();
        URL.revokeObjectURL(url);
    }

    function drawChart(canvasId, data, colors) {
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);

        const w = rect.width, h = rect.height;
        ctx.clearRect(0, 0, w, h);

        if (data.x.length < 2) return;
        const all = [...data.x, ...data.y, ...data.z];
        let min = Math.min(...all), max = Math.max(...all);
        const range = max - min || 1;
        min -= range * 0.15; max += range * 0.15;

        const channels = [
            { v: data.x, c: colors[0] },
            { v: data.y, c: colors[1] },
            { v: data.z, c: colors[2] }
        ];

        channels.forEach(ch => {
            ctx.strokeStyle = ch.c;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            for (let i = 0; i < ch.v.length; i++) {
                const x = (i / 199) * w;
                const y = h - ((ch.v[i] - min) / (max - min)) * h;
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();
        });
    }

    function loop() {
        drawChart('accChart', expState.chartData.acc, ['#ff6b6b', '#51cf66', '#339af0']);
        drawChart('gyroChart', expState.chartData.gyro, ['#ff6b6b', '#51cf66', '#339af0']);
        requestAnimationFrame(loop);
    }

    initSensors();
    requestAnimationFrame(loop);
    </script>
</body>
</html>
